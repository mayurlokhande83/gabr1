name: Secure DevSecOps Pipeline

on:
  push:
    branches:
      - master

jobs:
  build_and_package:
    name: BUILD-JOB
    runs-on: ubuntu-slim

    permissions: 
      actions: read
      contents: read
      security-events: read

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
    
