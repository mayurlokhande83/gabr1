name: Parallel build demo

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-slim
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Build
        run: npm install

  test:
    runs-on: ubuntu-slim
    needs: build
    steps:
      - name: test the code
        run: echo "Code tested successfully."

  deploy:
    runs-on: ubuntu-slim
    needs: test
    steps:
      - name: Deploy
        run: echo "Application deployed successfully"
        
