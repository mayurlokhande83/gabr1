name: Secure DevSecOps Pipeline

on:
  push:
    branches:
      - test

jobs:
  build_and_package:
    name: BUILD-JOB
    runs-on: self-hosted

    permissions: 
      actions: read
      contents: read
      security-events: read

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}

      - name: Build
        run: npm install
    
